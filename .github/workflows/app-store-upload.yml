name: App Store upload

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type UPLOAD to archive and upload this ref to App Store Connect
        required: true
        type: string

concurrency:
  group: app-store-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Confirm release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require explicit confirmation
        env:
          UPLOAD_CONFIRMATION: ${{ inputs.confirm }}
        run: test "$UPLOAD_CONFIRMATION" = "UPLOAD"

      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_REF" = "refs/heads/main"

  upload:
    name: Validate, archive, and upload
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.45.3"
          XCODEGEN_SHA256: "0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878"
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_dir="$RUNNER_TEMP/xcodegen-install"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_dir/xcodegen/bin/xcodegen" --version

      - name: Write build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          umask 077
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$ASC_API_KEY_BASE64"
          test -n "$ASC_KEY_ID"

          SUPABASE_URL="$SUPABASE_URL" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            python3 - <<'PY'
          import json
          import os
          import pathlib

          pathlib.Path("HeavyBandManager/Secrets.swift").write_text(
              "import Foundation\n\n"
              "enum Secrets {\n"
              f"    static let supabaseURL = {json.dumps(os.environ['SUPABASE_URL'])}\n"
              f"    static let supabaseAnonKey = {json.dumps(os.environ['SUPABASE_ANON_KEY'])}\n"
              "}\n"
          )
          PY

          mkdir -p .release
          ASC_API_KEY_BASE64="$ASC_API_KEY_BASE64" ASC_KEY_ID="$ASC_KEY_ID" \
            python3 - <<'PY'
          import base64
          import os
          import pathlib

          key_path = pathlib.Path(".release") / f"AuthKey_{os.environ['ASC_KEY_ID']}.p8"
          key_path.write_bytes(base64.b64decode(os.environ["ASC_API_KEY_BASE64"]))
          PY
          chmod 600 ".release/AuthKey_${ASC_KEY_ID}.p8"

      - name: Validate, archive, and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ github.workspace }}/.release/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          CONFIRM_UPLOAD: "1"
        run: make release

      - name: Remove credentials
        if: ${{ always() }}
        run: |
          rm -f HeavyBandManager/Secrets.swift
          rm -f .release/AuthKey_*.p8
