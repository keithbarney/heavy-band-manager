name: HeavyBandManager
options:
  bundleIdPrefix: com.keithbarney
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.3.2"
    CURRENT_PROJECT_VERSION: 10
    DEVELOPMENT_TEAM: BXKNJTU253
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  HeavyBandManager:
    build:
      targets:
        HeavyBandManager: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeavyBandManagerTests
  HeavyBandManagerScreenshots:
    build:
      targets:
        HeavyBandManager: all
    test:
      config: Debug
      targets:
        - HeavyBandManagerScreenshotTests

targets:
  HeavyBandManager:
    type: application
    platform: iOS
    sources:
      - HeavyBandManager
      - Shared
    settings:
      base:
        INFOPLIST_FILE: HeavyBandManager/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
      configs:
        Debug:
          BAND_APP_BUNDLE_IDENTIFIER: com.keithbarney.heavybandmanager.local
          PRODUCT_BUNDLE_IDENTIFIER: "$(BAND_APP_BUNDLE_IDENTIFIER)"
          WIDGET_APP_GROUP: group.com.keithbarney.heavybandmanager.local
          PRACTICE_URL_SCHEME: bandpractice-local
          BUNDLE_DISPLAY_NAME: Band Practice (L)
          APS_ENVIRONMENT: development
          PUSH_ENVIRONMENT: sandbox
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(ONBOARDING_PREVIEW_CONDITION) $(AVAILABILITY_TAB_PREVIEW_CONDITION)"
        Release:
          BAND_APP_BUNDLE_IDENTIFIER: com.keithbarney.heavybandmanager
          PRODUCT_BUNDLE_IDENTIFIER: "$(BAND_APP_BUNDLE_IDENTIFIER)"
          WIDGET_APP_GROUP: group.com.keithbarney.heavybandmanager
          PRACTICE_URL_SCHEME: bandpractice
          BUNDLE_DISPLAY_NAME: Band Practice
          APS_ENVIRONMENT: production
          PUSH_ENVIRONMENT: production
    postBuildScripts:
      - name: Copy isolated review artwork
        basedOnDependencyAnalysis: false
        script: |
          artwork_destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MockArtwork"
          if [ "$CONFIGURATION" = "Debug" ] && [ "$PLATFORM_NAME" = "iphonesimulator" ] && [ "$AVAILABILITY_TAB_PREVIEW_CONDITION" = "AVAILABILITY_TAB_PREVIEW" ]; then
            rm -rf "$artwork_destination"
            mkdir -p "$artwork_destination"
            cp "$SRCROOT"/Fixtures/MinorThreat/*.jpg "$SRCROOT"/Fixtures/MinorThreat/*.png "$artwork_destination/"
          elif [ -d "$artwork_destination" ]; then
            rm -rf "$artwork_destination"
          fi
    dependencies:
      - target: BandPracticeWidget
        embed: true
      - package: Supabase
      - package: DialKit
    entitlements:
      path: HeavyBandManager/HeavyBandManager.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(WIDGET_APP_GROUP)"
        com.apple.developer.applesignin:
          - Default
        aps-environment: "$(APS_ENVIRONMENT)"

  BandPracticeWidget:
    type: app-extension
    platform: iOS
    sources:
      - BandPracticeWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BAND_APP_BUNDLE_IDENTIFIER).widgets"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(ONBOARDING_PREVIEW_CONDITION) $(AVAILABILITY_TAB_PREVIEW_CONDITION)"
      configs:
        Debug:
          BAND_APP_BUNDLE_IDENTIFIER: com.keithbarney.heavybandmanager.local
          WIDGET_APP_GROUP: group.com.keithbarney.heavybandmanager.local
        Release:
          BAND_APP_BUNDLE_IDENTIFIER: com.keithbarney.heavybandmanager
          WIDGET_APP_GROUP: group.com.keithbarney.heavybandmanager
    info:
      path: BandPracticeWidget/Info.plist
      properties:
        CFBundleDisplayName: Band Practice
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WidgetAppGroup: "$(WIDGET_APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BandPracticeWidget/BandPracticeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(WIDGET_APP_GROUP)"

  HeavyBandManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HeavyBandManagerTests
    dependencies:
      - target: HeavyBandManager
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(AVAILABILITY_TAB_PREVIEW_CONDITION)"
      base:
        GENERATE_INFOPLIST_FILE: "YES"

  HeavyBandManagerScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HeavyBandManagerScreenshotTests
    dependencies:
      - target: HeavyBandManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keithbarney.heavybandmanager.screenshots
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: HeavyBandManager

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.43.0
  DialKit:
    url: https://github.com/mikelikesdesign/dialkit-ios
    exactVersion: 0.2.0
