name: HeavyBandManager
options:
  bundleIdPrefix: com.keithbarney
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: 8
    DEVELOPMENT_TEAM: BXKNJTU253
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  HeavyBandManager:
    build:
      targets:
        HeavyBandManager: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeavyBandManagerTests
  HeavyBandManagerScreenshots:
    build:
      targets:
        HeavyBandManager: all
    test:
      config: Debug
      targets:
        - HeavyBandManagerScreenshotTests

targets:
  HeavyBandManager:
    type: application
    platform: iOS
    sources:
      - HeavyBandManager
    settings:
      base:
        INFOPLIST_FILE: HeavyBandManager/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.keithbarney.heavybandmanager.local
          BUNDLE_DISPLAY_NAME: Band Practice (L)
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(ONBOARDING_PREVIEW_CONDITION) $(AVAILABILITY_TAB_PREVIEW_CONDITION)"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.keithbarney.heavybandmanager
          BUNDLE_DISPLAY_NAME: Band Practice
    postBuildScripts:
      - name: Copy isolated review artwork
        basedOnDependencyAnalysis: false
        script: |
          artwork_destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MockArtwork"
          if [ "$CONFIGURATION" = "Debug" ] && [ "$PLATFORM_NAME" = "iphonesimulator" ] && [ "$AVAILABILITY_TAB_PREVIEW_CONDITION" = "AVAILABILITY_TAB_PREVIEW" ]; then
            rm -rf "$artwork_destination"
            mkdir -p "$artwork_destination"
            cp "$SRCROOT"/Fixtures/MinorThreat/*.jpg "$SRCROOT"/Fixtures/MinorThreat/*.png "$artwork_destination/"
          elif [ -d "$artwork_destination" ]; then
            rm -rf "$artwork_destination"
          fi
    dependencies:
      - package: Supabase
      - package: DialKit
    entitlements:
      path: HeavyBandManager/HeavyBandManager.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default

  HeavyBandManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HeavyBandManagerTests
    dependencies:
      - target: HeavyBandManager
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(AVAILABILITY_TAB_PREVIEW_CONDITION)"
      base:
        GENERATE_INFOPLIST_FILE: "YES"

  HeavyBandManagerScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HeavyBandManagerScreenshotTests
    dependencies:
      - target: HeavyBandManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keithbarney.heavybandmanager.screenshots
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: HeavyBandManager

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.43.0
  DialKit:
    url: https://github.com/mikelikesdesign/dialkit-ios
    exactVersion: 0.2.0
